# Self-contained profile for the PoC. Run dbt with `--profiles-dir .`
# (or `export DBT_PROFILES_DIR=$(pwd)`) so it uses THIS file, not ~/.dbt.
#
# threads default to 1 for clean serial timing; the concurrency harness
# overrides with `--threads N` on the command line.
snowflake_poc:
  target: snowflake
  outputs:

    snowflake:
      type: snowflake
      account: "{{ env_var('SF_ACCOUNT') }}"
      user: "{{ env_var('SF_USER') }}"
      authenticator: "externalbrowser"
      role: "{{ env_var('SF_ROLE') }}"
      warehouse: "{{ env_var('SF_WAREHOUSE') }}"
      database: "{{ env_var('SF_DATABASE') }}"
      schema: "{{ env_var('SF_SCHEMA', 'poc_bench') }}"
      threads: "{{ env_var('DBT_THREADS', 1) | as_number }}"
      client_session_keep_alive: false

    # Option 2: non-interactive password auth for CI (GitHub Actions), using the
    # dedicated svc_github_ci service user (ci_dbt_role). No externalbrowser (that
    # needs a human at a browser) and no IP allowlist — here *auth is the
    # perimeter*, which is why this works against Snowflake's public endpoint but
    # not private-VPC Redshift.
    snowflake_ci:
      type: snowflake
      account: "{{ env_var('SF_ACCOUNT') }}"
      user: "{{ env_var('SF_USER') }}"
      password: "{{ env_var('SF_PASSWORD') }}"
      role: "{{ env_var('SF_ROLE') }}"
      warehouse: "{{ env_var('SF_WAREHOUSE') }}"
      database: "{{ env_var('SF_DATABASE') }}"
      schema: "{{ env_var('SF_SCHEMA', 'poc_bench') }}"
      threads: "{{ env_var('DBT_THREADS', 1) | as_number }}"
      client_session_keep_alive: false

    # Option 3: key pair (JWT) auth -- non-interactive like snowflake_ci but WITHOUT
    # a shared password. Only the PUBLIC key is registered on the user
    # (ALTER USER ... SET RSA_PUBLIC_KEY, needs USERADMIN); the PRIVATE key stays
    # local. dbt-snowflake infers key pair auth from private_key_path -- so no
    # `authenticator` line here. Drop private_key_passphrase if the key is
    # unencrypted (generated with `openssl pkcs8 ... -nocrypt`).
    snowflake_keypair:
      type: snowflake
      account: "{{ env_var('SF_ACCOUNT') }}"
      user: "{{ env_var('SF_USER') }}"
      private_key_path: "{{ env_var('SF_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('SF_PRIVATE_KEY_PASSPHRASE') }}"
      role: "{{ env_var('SF_ROLE') }}"
      warehouse: "{{ env_var('SF_WAREHOUSE') }}"
      database: "{{ env_var('SF_DATABASE') }}"
      schema: "{{ env_var('SF_SCHEMA', 'poc_bench') }}"
      threads: "{{ env_var('DBT_THREADS', 1) | as_number }}"
      client_session_keep_alive: false

    # Like option 3 above but using private_key instead of private_key_path because we 
    # cannot store the private key in a file in Codespaces. 
    # The private key is stored in an environment variable and passed to dbt via the 
    # profiles.yml file.
    snowflake_codespace:
      type: snowflake
      account: "{{ env_var('SF_ACCOUNT') }}"
      user: "{{ env_var('SF_USER') }}"
      private_key: "{{ env_var('SF_PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('SF_PRIVATE_KEY_PASSPHRASE') }}"
      role: "{{ env_var('SF_ROLE') }}"
      warehouse: "{{ env_var('SF_WAREHOUSE') }}"
      database: "{{ env_var('SF_DATABASE') }}"
      schema: "{{ env_var('SF_SCHEMA', 'poc_bench') }}"
      threads: "{{ env_var('DBT_THREADS', 1) | as_number }}"
      client_session_keep_alive: false

    redshift_serverless:
      type: redshift
      host: "{{ env_var('RS_HOST') }}"
      port: "{{ env_var('RS_PORT', 5439) | as_number }}"
      user: "{{ env_var('RS_USER') }}"
      password: "{{ env_var('RS_PASSWORD') }}"
      dbname: "{{ env_var('RS_DATABASE') }}"
      schema: "{{ env_var('RS_SCHEMA', 'poc_bench') }}"
      threads: "{{ env_var('DBT_THREADS', 1) | as_number }}"
      sslmode: prefer

    # Main provisioned cluster (prod-data-warehouse), same DB_* env vars as
    # rover-dbt's single_schema target. Needed for the Fivetran Glue/Iceberg
    # tables (DEV-157656): only this cluster has the fivetran-s3-poc-spectrum
    # role attached; serverless's Spectrum role can't read that bucket.
    # Locally: run `ssh -N redshift-tunnel` first.
    redshift:
      type: redshift
      host: "{{ env_var('DB_HOST') }}"
      port: "{{ env_var('DB_PORT', 5439) | as_number }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      dbname: rover
      schema: "{{ env_var('DBT_DEFAULT_SCHEMA', 'poc_bench') }}"
      threads: "{{ env_var('DBT_THREADS', 1) | as_number }}"
      sslmode: prefer
